name: Feature request
description: Propose new functionality for the rsadb library or CLI
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that rsadb does not support today?
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: Sketch the library API or CLI surface you have in mind. Rust signatures are welcome.
      render: rust

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or prior art (for example how Google adb or another client exposes this).

  - type: dropdown
    id: contribute
    attributes:
      label: Are you willing to contribute an implementation?
      options:
        - "Yes"
        - "Yes, with guidance"
        - "No"
    validations:
      required: true
